x-app: &app
  build: .
  environment: &env
    DATABASE_URL: postgres://uptime:uptime@db:5432/uptime
    REDIS_URL: redis://redis:6379/0
    MEDIA_ROOT: /app/media
    FRONTEND_URL: http://localhost:5173   # where emails link to (the SPA)
    DEBUG: "1"
  volumes:
    - .:/app
    - media:/app/media
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_started}

services:
  db:
    image: postgres:16
    environment: {POSTGRES_DB: uptime, POSTGRES_USER: uptime, POSTGRES_PASSWORD: uptime}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uptime"]
      interval: 3s
      retries: 20
  redis:
    image: redis:7
  web:
    <<: *app
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports: ["8000:8000"]
  frontend:        # the SPA (Vite dev server); /api is proxied to web, so the browser sees ONE origin
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      API_PROXY: http://web:8000
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
  worker:          # the check loop
    <<: *app
    command: celery -A config worker -Q checks -c 4 -n checks@%h -l info
  worker-notify:   # email
    <<: *app
    command: celery -A config worker -Q notifications -c 2 -n notify@%h -l info
  worker-reports:  # slow CSV exports, isolated from the check loop
    <<: *app
    command: celery -A config worker -Q reports -c 1 -O fair -n reports@%h -l info
  beat:
    <<: *app
    command: celery -A config beat -l info

volumes:
  pgdata:
  media:
