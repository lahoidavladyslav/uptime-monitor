<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ name }} — статус</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .bar{display:flex;gap:4px}.cell{flex:1;height:36px;border-radius:4px}
    .green{background:#2da44e}.yellow{background:#d4a72c}.red{background:#cf222e}.gray{background:#d0d7de}
  </style>
</head>
<body class="bg-light"><main class="container py-5" style="max-width:720px">
  <h1 class="h3">{{ name }}</h1>
  <p class="h5">
    {% if maintenance %}🛠 Планові роботи{% elif is_up is None %}⚪ Ще немає даних{% elif is_up %}🟢 Працює{% else %}🔴 Недоступний{% endif %}
  </p>
  <p>Uptime за 7 днів: <strong>{% if uptime is None %}немає даних{% else %}{{ uptime }}%{% endif %}</strong></p>
  <div class="bar">
    {% for d in bar %}<div class="cell {{ d.color }}" title="{{ d.day }}: {% if d.uptime is None %}немає даних{% else %}{{ d.uptime }}%{% endif %}"></div>{% endfor %}
  </div>
  <div class="d-flex justify-content-between small text-muted mt-1"><span>{{ bar.0.day }}</span><span>{{ bar.6.day }}</span></div>
</main></body>
</html>
