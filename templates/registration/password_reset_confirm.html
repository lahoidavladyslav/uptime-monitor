{% extends "base.html" %}
{% block content %}
{% if validlink %}
<h1 class="h3">Новий пароль</h1>
<form method="post" class="card card-body" style="max-width:420px">{% csrf_token %}
  {{ form.as_p }}<button class="btn btn-primary">Зберегти</button>
</form>
{% else %}
<h1 class="h3">Посилання недійсне</h1>
<p><a href="{% url 'password_reset' %}">Запросити нове</a>.</p>
{% endif %}
{% endblock %}
