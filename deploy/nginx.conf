# Reverse proxy in front of gunicorn. TLS is terminated BEFORE this (load balancer / Caddy / cloud LB),
# which must set X-Forwarded-Proto. Never expose this port directly to the internet with HTTPS=1.
map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; "" $scheme; }

# brute-force protection for credential endpoints
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
    listen 80;
    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json application/atom+xml;

    # security headers (nosniff, X-Frame-Options, Referrer-Policy, HSTS) are set once, by Django

    # server-rendered auth pages AND the JSON API twins (login/2fa/signup/resend/confirm/password-reset[/confirm])
    location ~ ^(/(login|signup|password-reset|confirm)/|/api/v1/auth/(login|signup|resend|confirm|password-reset)) {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy_common.conf;
        proxy_pass http://web:8000;
    }

    location / {
        include /etc/nginx/proxy_common.conf;
        proxy_pass http://web:8000;
    }
}
